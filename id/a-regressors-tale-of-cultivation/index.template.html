 paths=[...new Set(paths)];if(!paths.length)throw new Error('Tidak menemukan Markdown di sebelah HTML ini.');if(paths.length>5000)throw new Error('Manifest melebihi batas 5.000 berkas.');const loaded=await mapLimit(paths,6,async p=>{try{return[p,await getText(p)];}catch(error){warnings.push({type:'load',title:'Berkas tidak dapat dibaca',detail:error.message});return null;}});const files=new Map(loaded.filter(Boolean));if(!files.size)throw new Error('Markdown tidak dapat dimuat dari server.');await activate(files,'server',warnings);

function freshSaved(){return{version:1,positions:{},completed:[],bookmarks:[],notes:[],last:null};}
function validatePrefs(raw){const p={...DEFAULTS};if(!raw||typeof raw!=='object')return p;for(const [key,choices] of Object.entries({theme:['system','paper','sepia','night'],font:Object.keys(FONT_MAP),align:['left','justify'],spoilerMode:['auto','manual']}))if(choices.includes(raw[key]))p[key]=raw[key];for(const [key,bounds] of Object.entries({size:[16,30],leading:[1.5,2.3],width:[500,900],gap:[.8,2.4],tracking:[0,.12],words:[0,.16],weight:[400,500],wpm:[100,450],spoilerCutoff:[0,100000]}))if(Number.isFinite(Number(raw[key])))p[key]=clamp(raw[key],...bounds);p.spoilerAll=raw.spoilerAll===true;return p;}
function validateSaved(raw){const out=freshSaved();if(!raw||typeof raw!=='object')return out;const valid=n=>Number.isFinite(Number(n))&&app.model.chapterMap.has(Number(n));for(const key of ['completed','bookmarks'])if(Array.isArray(raw[key]))out[key]=[...new Set(raw[key].filter(valid).map(Number))];if(valid(raw.last))out.last=Number(raw.last);if(raw.positions&&typeof raw.positions==='object')for(const [n,p] of Object.entries(raw.positions)){if(valid(n)&&p&&typeof p==='object')out.positions[n]={ratio:clamp(p.ratio,0,1),pid:typeof p.pid==='string'?p.pid.slice(0,100):'',offset:clamp(p.offset,0,3000),updated:Number(p.updated)||0};}if(Array.isArray(raw.notes))out.notes=raw.notes.slice(0,2000).filter(n=>n&&typeof n==='object'&&valid(n.chapter)).map(n=>({id:typeof n.id==='string'?n.id.slice(0,80):crypto.randomUUID(),chapter:Number(n.chapter),quote:String(n.quote||'').slice(0,12000),text:String(n.text||'').slice(0,20000),pid:String(n.pid||'').slice(0,100),created:Number(n.created)||Date.now()}));return out;}

function renderReader(chapter){const chapters=app.model.chapters,index=chapters.indexOf(chapter),prev=chapters[index-1],next=chapters[index+1],terms=app.model.terms.filter(t=>t.chapters.includes(chapter.number));const bookmarked=app.saved.bookmarks.includes(chapter.number);return `<div class="reading-bar"><a href="#chapters" class="back">${icon('left')}<span>Kembali ke daftar bab</span></a><div class="row"><button class="icon-btn ${bookmarked?'active':''}" data-action="bookmark" data-chapter="${chapter.number}" aria-label="Tandai bab" aria-pressed="${bookmarked}">${icon('bookmark')}</button><button class="icon-btn" data-action="new-note" aria-label="Tulis catatan">${icon('note')}</button><button class="btn small ghost" data-action="recap" data-chapter="${chapter.number}">${icon('timeline')}Rekap</button><button class="btn small" data-action="focus">${icon('focus')}Mode fokus</button></div></div><div class="reader-layout"><div class="reader-column"><header class="chapter-heading"><p class="eyebrow">Bab ${pad(chapter.number)} <span aria-hidden="true">/</span> ${app.model.chapters.length} bab tersedia</p><h1>${esc(chapter.title)}</h1><div class="reader-meta"><span>${icon('clock')}~${readingMinutes(chapter)} menit</span><span>${num(chapter.words)} kata</span><span>${icon('file')}Markdown asli</span></div></header><article id="chapter-prose" class="prose" lang="${esc(/^[a-z]{2,3}(?:-[A-Za-z]{2,4})?$/.test(app.model.language)?app.model.language:'id')}" aria-label="Isi bab ${chapter.number}">${markdownHTML(chapter.body,chapter.path)}</article><div class="reader-end"><p class="eyebrow" style="text-align:center">Akhir bab ${chapter.number}</p><h2 class="reader-end-title">Satu halaman lagi dalam perjalananmu.</h2><p>Tandai selesai untuk membuka rekap dan atlas sesuai batas bacamu.</p><div class="row wrap" style="justify-content:center"><button class="btn primary" data-action="complete" data-chapter="${chapter.number}">${icon('check')}${app.saved.completed.includes(chapter.number)?'Sudah ditandai selesai':'Tandai selesai'}</button><button class="btn" data-action="recap" data-chapter="${chapter.number}">Buka rekap</button><button class="btn ghost" data-action="chapter-notes" data-chapter="${chapter.number}">Catatan penerjemah</button></div><div class="reader-nav">${prev?`<a href="#read/${prev.number}"><small>${icon('left')}Bab sebelumnya</small><strong>${esc(prev.title)}</strong></a>`:'<div><small>Awal koleksi</small><strong>Ini bab pertama yang tersedia.</strong></div>'}${next?`<a class="next" href="#read/${next.number}"><small>Bab berikutnya ${icon('arrow')}</small><strong>${esc(next.title)}</strong></a>`:'<div class="next"><small>Akhir koleksi saat ini</small><strong>Bab berikutnya belum tersedia.</strong></div>'}</div></div></div><aside class="reader-aside" aria-label="Konteks membaca"><p class="eyebrow">Di halaman ini</p><div class="reader-ring"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" fill="none" stroke="var(--line)" stroke-width="2"/><circle id="progress-ring" cx="22" cy="22" r="19" fill="none" stroke="var(--green)" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg><div><strong id="reader-percent">0%</strong><small>posisi dalam bab</small></div></div><p>Posisi dibaca akan tersimpan otomatis. Status selesai tetap kamu yang menentukan.</p><div class="side-links"><button data-action="settings">${icon('focus')}Atur kenyamanan</button><button data-action="chapter-notes" data-chapter="${chapter.number}">${icon('file')}Catatan penerjemah</button><button data-action="source" data-path="${esc(chapter.path)}">${icon('archive')}Lihat sumber asli</button><button data-action="print">${icon('print')}Cetak bab ini</button></div><hr class="rule"><p class="eyebrow">Istilah dalam bab ini</p><div class="term-tags">${terms.slice(0,10).map(t=>`<button class="term-tag" data-action="term" data-id="${t.id}">${esc(t.canonical)}</button>`).join('')||'<p>Belum ada istilah glosarium yang cocok.</p>'}</div>${terms.length>10?`<p style="margin-top:10px">${terms.length-10} istilah lainnya di atlas.</p>`:''}<p style="margin-top:15px">Deskripsi global dilindungi dari spoiler, termasuk saat nama sudah dikenali.</p><a class="text-link" href="#atlas">Buka atlas ${icon('arrow')}</a></aside></div>`;}
function tabsHTML(items,active,action){return `<div class="tabs" aria-label="Pilihan tampilan">${items.map(([key,label])=>`<button class="tab ${key===active?'active':''}" data-action="${action}" data-tab="${key}" aria-pressed="${key===active}">${label}</button>`).join('')}</div>`;}
const TYPE_LABELS={character:'Tokoh',alias:'Alias',title:'Gelar',organization:'Organisasi',location:'Lokasi',item:'Benda',ability:'Kemampuan',technique:'Teknik',rank:'Tingkatan',species:'Spesies',currency:'Mata uang','cultural term':'Konsep',catchphrase:'Ungkapan','system term':'Sistem',other:'Lainnya'};
function typeIcon(t){return t.types.includes('character')?'people':t.types.includes('location')?'pin':t.types.includes('rank')||t.types.includes('ability')?'spark':'book';}
function entityCard(t){return `<button class="entity" data-action="term" data-id="${t.id}"><span class="entity-top">${icon(typeIcon(t))}<span class="entity-type">${esc(t.types.map(v=>TYPE_LABELS[v]||v).join(' / '))}</span></span><h3>${esc(t.canonical)}</h3>${t.source!==t.canonical?`<span class="source-term">${esc(t.source)}</span>`:''}<p>${app.prefs.spoilerAll?esc(t.notes.slice(0,115)+(t.notes.length>115?'...':'')):'Nama dikenali. Catatan global tetap dilindungi.'}</p><span class="entity-foot">${t.first===null?'Waktu kemunculan belum dicatat':'Mulai bab '+t.first} &nbsp; &nearr;</span></button>`;}
function filteredTerms(){let terms=knownTerms();if(app.atlasTab==='characters')terms=terms.filter(t=>t.types.includes('character')||t.types.includes('alias'));if(app.atlasTab==='locations')terms=terms.filter(t=>t.types.includes('location'));if(app.atlasTab==='systems')terms=terms.filter(t=>t.types.some(v=>['rank','ability','technique','cultural term','system term'].includes(v)));if(app.atlasType!=='all')terms=terms.filter(t=>t.types.includes(app.atlasType));const q=normal(app.atlasQuery);if(q)terms=terms.filter(t=>normal(t.source+' '+t.canonical+' '+(app.prefs.spoilerAll?t.notes:'')).includes(q));return terms.sort((a,b)=>a.canonical.localeCompare(b.canonical));}
function atlasResultsHTML(){if(app.atlasTab==='connections')return renderConnections();const list=filteredTerms(),pageSize=24,totalPages=Math.max(1,Math.ceil(list.length/pageSize));app.atlasPage=Math.min(app.atlasPage,totalPages);const slice=list.slice((app.atlasPage-1)*pageSize,app.atlasPage*pageSize);const doc={characters:'characters.md',locations:'locations.md',systems:'terminology.md'}[app.atlasTab];const docLink=doc&&app.files.has(doc)?`<div class="notice" style="margin-bottom:20px">${icon('file')}<div>Juga tersedia catatan ${esc(doc)}. Deskripsi ini bersifat global, bukan snapshot setiap bab.<br><button class="text-link" data-action="source" data-path="${esc(doc)}">Buka dokumen sumber ${icon('arrow')}</button></div></div>`:'';return `${docLink}<p class="results-caption">${list.length} entri pada tampilan ini &middot; ${app.model.terms.length} entri unik dalam glosarium${app.model.termRows!==app.model.terms.length?` (${app.model.termRows} baris sumber)`:''}</p>${list.length?`<div class="entity-grid">${slice.map(entityCard).join('')}</div>${totalPages>1?`<div class="pagination"><button class="btn small" data-action="atlas-page" data-page="${app.atlasPage-1}" ${app.atlasPage===1?'disabled':''}>Sebelumnya</button><span class="small muted">${app.atlasPage} / ${totalPages}</span><button class="btn small" data-action="atlas-page" data-page="${app.atlasPage+1}" ${app.atlasPage===totalPages?'disabled':''}>Berikutnya</button></div>`:''}`:empty('Biarkan dunia terbuka perlahan',safeCutoff()===0?'Tandai bab selesai, atau atur batas bab yang sudah kamu baca. Atlas tidak menampilkan istilah dari masa depan.':'Tidak ada istilah yang cocok dengan filter dan batas spoiler saat ini.','<button class="btn" data-action="spoilers">Atur batas baca</button>','shield')}`;}
function renderAtlas(){const types=[...new Set(app.model.terms.flatMap(t=>t.types))].sort();return `<div class="page-title"><p class="eyebrow">Mengenali dunia di antara halaman</p><h1>Atlas cerita</h1><p>Nama, tempat, dan istilah yang tidak perlu kamu ingat sendirian. Setiap informasi tetap terhubung dengan sumbernya.</p></div>${spoilerBar()}${tabsHTML([['glossary','Glosarium'],['characters','Tokoh'],['locations','Lokasi'],['systems','Teknik & sistem'],['connections','Peta koneksi']],app.atlasTab,'atlas-tab')}<div class="toolbar" ${app.atlasTab==='connections'?'hidden':''}><div class="input-search">${icon('search')}<input id="atlas-query" type="search" placeholder="Cari istilah atau nama..." aria-label="Cari dalam atlas" value="${esc(app.atlasQuery)}"></div><select id="atlas-type" class="select-compact" aria-label="Kategori glosarium"><option value="all">Semua kategori</option>${types.map(v=>`<option value="${esc(v)}" ${app.atlasType===v?'selected':''}>${esc(TYPE_LABELS[v]||v)}</option>`).join('')}</select></div><div id="atlas-results">${atlasResultsHTML()}</div>${footer()}`;}
function renderConnections(){
 const cutoff=safeCutoff();let nodes=knownTerms().filter(t=>t.types.includes('character')).map(t=>({...t,visibleChapters:t.chapters.filter(n=>n<=cutoff)})).filter(t=>t.visibleChapters.length).sort((a,b)=>b.visibleChapters.length-a.visibleChapters.length||a.canonical.localeCompare(b.canonical)).slice(0,12);const edges=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const shared=nodes[i].visibleChapters.filter(c=>nodes[j].visibleChapters.includes(c));if(shared.length)edges.push({a:nodes[i],b:nodes[j],chapters:shared});}app.graphEdges=edges;
 if(!edges.length)return empty('Koneksi belum terbuka','Peta membutuhkan setidaknya dua nama glosarium yang muncul pada bab yang sama dalam batas bacamu.','<button class="btn" data-action="spoilers">Atur batas baca</button>','graph');
 nodes.forEach((n,i)=>{const a=(i/nodes.length)*Math.PI*2-Math.PI/2;n.x=400+260*Math.cos(a);n.y=213+145*Math.sin(a);});const network=`<svg class="network" viewBox="0 0 800 450" role="img" aria-label="Peta kemunculan bersama ${nodes.length} tokoh. Daftar koneksi interaktif tersedia di bawah.">${edges.map((e,i)=>`<line class="edge" x1="${e.a.x}" y1="${e.a.y}" x2="${e.b.x}" y2="${e.b.y}" stroke-width="${Math.min(3,.6+e.chapters.length*.22)}" data-action="edge" data-index="${i}"><title>${esc(e.a.canonical)} + ${esc(e.b.canonical)}: ${e.chapters.length} bab</title></line>`).join('')}${nodes.map(n=>`<g class="node" data-action="term" data-id="${n.id}" role="button" tabindex="0" aria-label="Buka ${esc(n.canonical)}" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="${15+Math.min(6,n.visibleChapters.length)}"/><text x="${n.x}" y="${n.y+4}" text-anchor="middle" style="font-size:10px">${esc(n.canonical.split(' ').map(v=>v[0]).slice(0,2).join(''))}</text><text x="${n.x}" y="${n.y+39}" text-anchor="middle">${esc(n.canonical)}</text></g>`).join('')}</svg>`;return `<div class="notice" style="margin-bottom:20px">${icon('info')}<div><strong>Kemunculan bersama, bukan hubungan kanonis.</strong><p>Garis berarti dua nama cocok dengan teks bab yang sama. Tidak berarti teman, lawan, keluarga, atau pernah bertemu. Klik garis atau daftar untuk melihat bab bukti. Pencocokan nama persis dapat melewatkan alias.</p></div></div><div class="graph-panel">${network}</div><div class="section-head"><h2>Bukti di balik garis</h2><span class="small muted">${nodes.length} tokoh &middot; ${edges.length} koneksi</span></div><div class="graph-list">${edges.toSorted((a,b)=>b.chapters.length-a.chapters.length).map(e=>`<button class="graph-edge-row" data-action="edge-pair" data-a="${e.a.id}" data-b="${e.b.id}"><span>${esc(e.a.canonical)} <span aria-hidden="true">&harr;</span> ${esc(e.b.canonical)}</span><small>${e.chapters.length} bab</small></button>`).join('')}</div>`;
}
function renderTimeline(){const choices=[['plot','Peristiwa'],['time','Waktu & tempat'],['characters','Perkembangan'],['powers','Teknik & benda'],['threads','Pertanyaan terbuka'],['continuity','Kontinuitas']];let body='';if(app.timelineMode==='continuity'){body=app.files.has('continuity.md')?(app.prefs.spoilerAll?`<div class="card card-pad doc-prose">${markdownHTML(app.files.get('continuity.md'),'continuity.md')}</div><button class="text-link" data-action="source" data-path="continuity.md">Lihat Markdown asli ${icon('arrow')}</button>`:empty('Kontinuitas menyimpan masa depan','continuity.md bersifat kumulatif dan tidak memberi tanggal untuk setiap fakta. Buka secara sadar setelah membaca, bukan berdasarkan First Seen.','<button class="btn" data-action="source" data-path="continuity.md">Buka dengan peringatan spoiler</button>','lock')):empty('Belum ada catatan kontinuitas','Tambahkan continuity.md melalui workflow terjemahan.');}else{const visible=app.model.chapters.filter(c=>c.number<=safeCutoff());body=visible.length?`<div class="timeline">${visible.map(c=>{const relevant=c.recap?.sections.filter(s=>headingCategory(s.heading)===app.timelineMode)||[];return `<section class="timeline-item"><span class="timeline-dot">${c.number}</span><div class="timeline-heading"><h3>${esc(c.title)}</h3><a class="text-link" href="#read/${c.number}">Baca ${icon('arrow')}</a></div>${!c.recap?'<div class="timeline-missing">Rekap belum tersedia. Tidak ada ringkasan pengganti yang dibuat otomatis.</div>':!relevant.length?'<div class="timeline-missing">Bagian ini belum ditulis dalam rekap sumber.</div>':`<details class="card timeline-box" ${visible.length===1?'open':''}><summary>${esc(relevant[0].heading)} &middot; Bab ${c.number}</summary><div class="doc-prose">${relevant.map(s=>markdownHTML(s.text,c.recap.path)).join('')}</div><p class="source-hint">Sumber: ${esc(c.recap.path)}</p><button class="text-link" data-action="source" data-path="${esc(c.recap.path)}">Baca rekap lengkap ${icon('arrow')}</button></details>`}</section>`;}).join('')}</div>`:empty('Belum saatnya mengintip ke depan','Rekap terbuka setelah bab ditandai selesai, atau setelah kamu menentukan batas baca secara manual.','<button class="btn" data-action="spoilers">Atur batas baca</button>','shield');}return `<div class="page-title"><p class="eyebrow">Mengingat tanpa kehilangan arah</p><h1>Jejak cerita</h1><p>Telusuri kembali peristiwa, perkembangan, dan pertanyaan yang belum terjawab. Disusun per bab dari rekap asli, tanpa menyimpulkan kronologi baru.</p></div>${spoilerBar()}${tabsHTML(choices,app.timelineMode,'timeline-tab')}${body}${footer()}`;}
function fileKind(p){if(/(^|\/)chapters?\//.test(p))return'Bab';if(/(^|\/)recaps?\//.test(p))return'Rekap';return'Dokumen pendukung';}
function fileResultsHTML(){const files=[...app.files].filter(([p])=>normal(p).includes(normal(app.archiveQuery))).sort(([a],[b])=>{const rank=p=>p.includes('/')?1:0;return rank(a)-rank(b)||a.localeCompare(b);});return `<p class="results-caption">${files.length} Markdown &middot; Pilih berkas untuk membaca versi tampilan atau sumber mentah.</p><div class="mini-list">${files.map(([p,s])=>`<button class="file-row" style="width:100%;text-align:left" data-action="source" data-path="${esc(p)}">${icon(fileKind(p)==='Bab'?'book':'file')}<span class="file-name">${esc(p)}<br><span class="file-kind">${fileKind(p)}</span></span><small>${(new TextEncoder().encode(s).length/1024).toFixed(1)} KB</small>${icon('chevron')}</button>`).join('')}</div>`;}
function renderQuality(){const m=app.model;const count=type=>m.issues.filter(i=>i.type===type).length;return `<div class="notice">${icon('info')}<div><strong>Temuan ditampilkan, bukan disembunyikan.</strong><p>Pembaca memperbaiki navigasi pada tampilan berdasarkan berkas yang tersedia. Tidak ada Markdown asli yang diubah atau ringkasan yang dikarang.</p></div></div><div class="quality-grid"><div class="quality-card"><strong>${m.chapters.length}</strong><small>Bab berhasil dimuat</small></div><div class="quality-card"><strong>${count('recap')}</strong><small>Rekap belum tersedia</small></div><div class="quality-card"><strong>${count('navigation')}</strong><small>Tautan navigasi tidak tersedia</small></div></div>${m.meta.chapters?`<div class="notice" style="margin-bottom:22px">${icon('book')}<div>Cakupan yang ditulis di NOVEL.md: <strong>${esc(m.meta.chapters)}</strong>. Berkas bab yang benar-benar tersedia: <strong>${m.chapters.length}</strong>. Keduanya tidak diperlakukan sebagai angka yang sama.</div></div>`:''}<div class="section-head"><h2>Catatan data</h2><span class="small muted">${m.issues.length} temuan</span></div>${m.issues.length?`<div class="mini-list">${m.issues.map(i=>`<div class="issue-row">${icon(i.type==='glossary'?'info':'alert')}<div><strong>${esc(i.title)}</strong><p>${esc(i.detail)}</p>${i.term&&app.prefs.spoilerAll?`<button class="text-link" data-action="term" data-id="${i.term}">Lihat istilah</button>`:''}</div></div>`).join('')}</div>`:empty('Tidak ada masalah struktural terdeteksi','Pemeriksaan ini bukan penilaian kebenaran terjemahan, fakta cerita, atau kualitas bahasa.','','check')}<p class="muted small" style="margin-top:20px">Pemeriksaan otomatis bersifat struktural. Perbedaan istilah dan kronologi di dalam cerita tetap perlu ditinjau penerjemah.</p>`;}
function renderArchive(){let body='';if(app.archiveTab==='files')body=`<div class="toolbar"><div class="input-search">${icon('search')}<input id="archive-query" type="search" value="${esc(app.archiveQuery)}" placeholder="Cari nama berkas..." aria-label="Cari berkas sumber"></div><div class="row"><button class="btn small" data-action="refresh">${icon('refresh')}Muat ulang</button><button class="btn small" data-action="source-picker">${icon('folder')}Ganti sumber</button></div></div><div id="file-results">${fileResultsHTML()}</div>`;else if(app.archiveTab==='quality')body=renderQuality();else{const docs=['NOVEL.md','STYLE_GUIDE.md','qa-log.md'].filter(p=>app.files.has(p));body=`<div class="stack">${docs.map(p=>`<div class="card card-pad"><div class="row between"><h2 style="font-size:24px">${p==='NOVEL.md'?'Tentang novel':p==='STYLE_GUIDE.md'?'Panduan gaya terjemahan':'Keputusan penerjemah'}</h2><button class="icon-btn" data-action="source" data-path="${p}" aria-label="Lihat ${p}">${icon('file')}</button></div>${p==='qa-log.md'&&!app.prefs.spoilerAll?'<p class="muted small" style="margin-top:15px">Catatan QA dapat menyebut peristiwa atau identitas. Buka sumber dengan peringatan spoiler.</p>':`<div class="doc-prose" style="margin-top:18px">${markdownHTML(stripTitle(app.files.get(p)),p)}</div>`}</div>`).join('')}</div>`;}return `<div class="page-title"><p class="eyebrow">Dekat dengan teks aslinya</p><h1>Arsip &amp; kualitas</h1><p>Seluruh Markdown novel tetap dapat ditelusuri. Data yang belum lengkap ditandai dengan jelas, bukan diisi dengan asumsi.</p></div>${tabsHTML([['files','Berkas sumber'],['quality','Kualitas data'],['guide','Panduan & QA']],app.archiveTab,'archive-tab')}${body}${footer()}`;}
function notesResultsHTML(){const notes=app.saved.notes.toSorted((a,b)=>b.created-a.created);const bookmarks=app.model.chapters.filter(c=>app.saved.bookmarks.includes(c.number));let html='';if(app.notesTab==='all'||app.notesTab==='bookmarks'){html+=`<div class="section-head"><h2>Halaman yang kamu tandai</h2><span class="small muted">${bookmarks.length} penanda</span></div>${bookmarks.length?`<div class="chapters-table">${chapterRows(bookmarks)}</div>`:empty('Simpan halaman untuk kembali','Tekan ikon penanda saat membaca atau pada daftar bab.','','bookmark')}`;}if(app.notesTab==='all'||app.notesTab==='quotes'){html+=`<div class="section-head"><h2>Kutipan &amp; catatan</h2><span class="small muted">${notes.length} catatan</span></div>${notes.length?notes.map(n=>`<article class="card saved-note"><div class="note-meta"><a href="#read/${n.chapter}${n.pid?'?p='+encodeURIComponent(n.pid):''}">Bab ${n.chapter} &middot; ${esc(app.model.chapterMap.get(n.chapter)?.title||'')}</a><span>${new Date(n.created).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</span></div>${n.quote?`<blockquote>${esc(n.quote)}</blockquote>`:''}${n.text?`<p class="note-body">${esc(n.text)}</p>`:''}<div class="row" style="justify-content:flex-end;margin-top:15px"><button class="btn small ghost" data-action="edit-note" data-id="${esc(n.id)}">${icon('note')}Edit</button><button class="icon-btn" data-action="delete-note" data-id="${esc(n.id)}" aria-label="Hapus catatan">${icon('trash')}</button></div></article>`).join(''):empty('Kalimat yang ingin kamu simpan','Pilih teks di dalam bab untuk menyimpan kutipan, atau gunakan tombol catatan saat membaca.','','quote')}`;}return html;}
function renderNotes(){return `<div class="page-title"><p class="eyebrow">Jejak kecil milikmu sendiri</p><h1>Catatan saya</h1><p>Halaman yang ingin dikunjungi kembali dan kalimat yang ingin disimpan. Pribadi, lokal, dan tidak mengubah naskah novel.</p></div><div class="row wrap"><button class="btn small" data-action="export-backup">${icon('download')}Ekspor cadangan</button><button class="btn small" data-action="import-backup">${icon('upload')}Impor cadangan</button><button class="btn small ghost" data-action="export-notes">Ekspor catatan .md</button></div><p class="muted small" style="margin-top:12px">Cadangan memuat progres, penanda, pengaturan, dan catatan. Tidak ada sinkronisasi akun atau cloud.</p>${tabsHTML([['all','Semua'],['bookmarks','Penanda'],['quotes','Kutipan & catatan']],app.notesTab,'notes-tab')}<div id="notes-results">${notesResultsHTML()}</div>${footer()}`;}
function renderOnboarding(error=''){app.status='empty';app.route='home';renderShell();$('#main-content').innerHTML=`<div class="onboarding"><div class="hero-art">${landscape()}</div><p class="eyebrow">Pembaca novel dari Markdown</p><h1 style="margin-top:13px">Cerita yang kamu punya.<br>Ruang untuk menikmatinya.</h1><p class="muted" style="margin-top:20px;max-width:650px">Buka folder novel atau ZIP hasil workflow terjemahanmu. Bab, rekap, glosarium, dan catatan akan menemukan tempatnya di sini.</p>${error?`<div class="notice warn" style="margin-top:22px">${icon('info')}<div>${esc(error)}</div></div>`:''}<div class="import-zone" id="drop-zone">${icon('folder')}<h3>Bawa bukumu ke sini.</h3><p>Tarik satu ZIP ke area ini, atau pilih sumber di bawah. Berkas dibaca di browser, tidak diunggah ke server lain.</p><div class="row wrap" style="justify-content:center"><button class="btn primary" data-action="import-zip">${icon('upload')}Pilih ZIP novel</button><button class="btn" data-action="import-folder">${icon('folder')}Pilih folder</button></div></div><p class="setup-caption">Mode file lokal: pilih ulang sumber setelah memuat ulang halaman.<br>Progres dan catatan tetap disimpan oleh browser jika penyimpanan tersedia.</p><div class="notice" style="margin-top:24px">${icon('info')}<div><strong>Memakai folder proyek dengan server?</strong><p>Letakkan HTML di samping NOVEL.md, jalankan <code>node serve.mjs</code>, lalu buka alamat lokal yang tercetak. Untuk hosting statis, sertakan reader-manifest.json.</p></div></div></div>`;$('#reading-bottom').hidden=true;bindDropZone();}

 if(app.status!=='ready'||!app.model)return;const raw=location.hash.slice(1)||'home';if(raw==='main-content'){$('#main-content').focus();return;}capturePosition();app.readingReady=false;app.selection=null;$('#quote-toolbar').hidden=true;const [path,qs='']=raw.split('?');const [route,number]=path.split('/');app.route=Object.hasOwn(appLabels,route)?route:'home';app.chapter=null;document.body.classList.toggle('is-reading',app.route==='read');if(app.route!=='read'){app.focus=false;document.body.classList.remove('focus-mode');}renderShell();let content='';

 if(app.chapter){assignParagraphIds();setupReadingBottom();const query=new URLSearchParams(qs);requestAnimationFrame(()=>requestAnimationFrame(()=>{if(query.has('find'))highlightInChapter(query.get('find'));if(query.has('p')){const el=$(`[data-pid="${CSS.escape(query.get('p'))}"]`);if(el)el.scrollIntoView({block:'start'});else restorePosition(app.chapter.number);}else if(query.has('find')){const target=$('#chapter-prose mark');if(target)target.scrollIntoView({block:'center'});else restorePosition(app.chapter.number);}else restorePosition(app.chapter.number);app.readingReady=true;updateReadingProgress();}));}else window.scrollTo(0,0);
}

/* Reading state and stable paragraph anchors. */
function assignParagraphIds(){const counts=new Map();$$('#chapter-prose > p, #chapter-prose > blockquote, #chapter-prose > h2, #chapter-prose > h3, #chapter-prose > ul, #chapter-prose > ol, #chapter-prose > pre').forEach(el=>{const key=hash(el.textContent.trim()),count=(counts.get(key)||0)+1;counts.set(key,count);el.dataset.pid='p-'+key+'-'+count;el.id=el.dataset.pid;});}
function readingRatio(){const article=$('#chapter-prose');if(!article)return 0;const top=window.scrollY+article.getBoundingClientRect().top;const extent=Math.max(1,article.offsetHeight-window.innerHeight+150);return clamp((window.scrollY-top+110)/extent,0,1);}
function capturePosition(){if(!app.readingReady||!app.chapter||!app.model)return;const els=$$('#chapter-prose [data-pid]');let target=els[0];for(const el of els){if(el.getBoundingClientRect().top<=115)target=el;else break;}if(!target)return;app.saved.positions[app.chapter.number]={ratio:readingRatio(),pid:target.dataset.pid,offset:Math.max(0,110-target.getBoundingClientRect().top),updated:Date.now()};}
function restorePosition(chapterNumber){const pos=app.saved.positions[chapterNumber];if(!pos||pos.ratio<=.002){window.scrollTo(0,0);return;}const target=pos.pid?$(`[data-pid="${CSS.escape(pos.pid)}"]`):null;if(target){window.scrollTo(0,window.scrollY+target.getBoundingClientRect().top-110+(pos.offset||0));return;}const article=$('#chapter-prose');if(article)window.scrollTo(0,window.scrollY+article.getBoundingClientRect().top+pos.ratio*(article.offsetHeight-window.innerHeight+150)-110);}
function updateReadingProgress(){if(!app.chapter)return;const percent=Math.round(readingRatio()*100);const label=$('#reader-percent'),bottom=$('#bottom-percent'),ring=$('#progress-ring'),track=$('#bottom-progress');if(label)label.textContent=percent+'%';if(bottom)bottom.textContent=percent+'%';if(ring)ring.setAttribute('stroke-dashoffset',String(100-percent));if(track)track.style.width=percent+'%';}
function setupReadingBottom(){const c=app.chapter;const i=app.model.chapters.indexOf(c),prev=app.model.chapters[i-1],next=app.model.chapters[i+1];$('#reading-bottom').innerHTML=`<div class="progress-track"><span id="bottom-progress"></span></div><span class="read-label">Bab ${c.number} &middot; ${esc(c.title)}</span><div class="row"><span id="bottom-percent">0%</span>${prev?`<a href="#read/${prev.number}" aria-label="Bab sebelumnya">${icon('left')}</a>`:''}<button data-action="settings" aria-label="Pengaturan membaca" style="font-family:Georgia,serif;font-size:18px">Aa</button>${next?`<a href="#read/${next.number}" aria-label="Bab berikutnya">${icon('arrow')}</a>`:''}</div>`;}
function highlightInChapter(query){if(!query||query.length>120)return;const article=$('#chapter-prose');if(!article)return;const walker=document.createTreeWalker(article,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);const re=new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');for(const node of nodes){if(node.parentElement.closest('code,pre'))continue;let match,start=0,found=false;const frag=document.createDocumentFragment();while((match=re.exec(node.textContent))!==null){found=true;frag.append(node.textContent.slice(start,match.index));const mark=document.createElement('mark');mark.textContent=match[0];frag.append(mark);start=match.index+match[0].length;}if(found){frag.append(node.textContent.slice(start));node.replaceWith(frag);}}}
function closeMobileNav(){$('#sidebar').classList.remove('mobile-open');$('#mobile-backdrop').hidden=true;const button=$('[data-action="mobile-menu"]');if(button)button.setAttribute('aria-expanded','false');$('#sidebar').removeAttribute('role');$('#sidebar').removeAttribute('aria-modal');$('#sidebar').inert=matchMedia('(max-width: 760px)').matches;$('.app-shell').inert=false;}

function confirmAction(title,message,label='Tampilkan'){return new Promise(resolve=>{const d=$('#confirm-dialog');d.innerHTML=`<div class="dialog-header"><h2 id="confirm-title">${esc(title)}</h2><button class="icon-btn" data-action="close-dialog" data-dialog="confirm-dialog" aria-label="Tutup">${icon('close')}</button></div><div class="dialog-body"><div class="notice warn">${icon('shield')}<p>${esc(message)}</p></div></div><div class="dialog-footer"><button class="btn" id="confirm-cancel" autofocus>Batal</button><button class="btn primary" id="confirm-yes">${esc(label)}</button></div>`;let settled=false;const settle=value=>{if(settled)return;settled=true;d.removeEventListener('close',onClose);d.close();resolve(value);};const onClose=()=>settle(false);d.addEventListener('close',onClose,{once:true});$('#confirm-cancel').onclick=()=>settle(false);$('#confirm-yes').onclick=()=>settle(true);showDialog('confirm-dialog');});}
function dialogHeader(title,subtitle=''){return `<div class="dialog-header"><div><h2 id="content-dialog-title">${esc(title)}</h2>${subtitle?`<small>${esc(subtitle)}</small>`:''}</div><button class="icon-btn" data-action="close-dialog" data-dialog="content-dialog" aria-label="Tutup">${icon('close')}</button></div>`;}

function openSettings(section='appearance'){const p=app.prefs;$('#settings-dialog').innerHTML=`<div class="dialog-header"><div><h2 id="settings-title">Ruang baca, caramu.</h2><small>Pengaturan tersimpan di browser ini.</small></div><button class="icon-btn" data-action="close-dialog" data-dialog="settings-dialog" aria-label="Tutup pengaturan">${icon('close')}</button></div><div class="dialog-body"><section class="setting-group"><h3>Suasana halaman</h3><div class="theme-options">${[['system','Sistem'],['paper','Kertas'],['sepia','Sepia'],['night','Malam']].map(([v,l])=>`<button class="theme-option ${p.theme===v?'active':''}" data-action="theme" data-theme="${v}" aria-pressed="${p.theme===v}"><span class="theme-preview">Aa</span><span>${l}</span></button>`).join('')}</div></section><section class="setting-group"><h3>Huruf yang terasa pas</h3><div class="font-options">${[['literary','Literary'],['classic','Classic'],['sans','Modern'],['mono','Monospace']].map(([v,l])=>`<button class="font-option ${p.font===v?'active':''}" style="font-family:${esc(FONT_MAP[v])}" data-action="font" data-font="${v}" aria-pressed="${p.font===v}">${l}</button>`).join('')}</div>${rangeControl('size','Ukuran huruf',16,30,1,' px')}${rangeControl('leading','Tinggi baris',1.5,2.3,.05,'')}${rangeControl('width','Lebar kolom',500,900,20,' px')}${rangeControl('gap','Jarak paragraf',.8,2.4,.1,' em')}<details style="margin-top:18px"><summary class="small muted" style="cursor:pointer;min-height:36px">Tipografi lanjutan</summary>${rangeControl('tracking','Jarak huruf',0,.12,.01,' em')}${rangeControl('words','Jarak kata',0,.16,.01,' em')}<div class="field"><label class="field-label" for="setting-align">Perataan teks</label><select id="setting-align" data-setting="align" style="width:100%"><option value="left" ${p.align==='left'?'selected':''}>Rata kiri (default)</option><option value="justify" ${p.align==='justify'?'selected':''}>Rata kiri-kanan</option></select></div><label class="switch-row" for="setti function requiresSpoiler(path){if(app.prefs.spoilerAll)return false;if(['NOVEL.md','STYLE_GUIDE.md','chapter-index.md'].includes(path))return false;if(/(^|\/)(?:chapters?|recaps?)\//i.test(path)){const n=chapterNumber(path,frontmatter(app.files.get(path)||'').meta,(app.files.get(path)||'').split('\n')[0]);return n===null||n>safeCutoff();}return true;}

function openEdge(edge){if(!edge)return;$('#content-dialog').innerHTML=dialogHeader('Kemunculan bersama','Dari pencocokan nama di teks bab')+`<div class="dialog-body"><h3 class="serif" style="font-size:27px">${esc(edge.a.canonical)} &amp; ${esc(edge.b.canonical)}</h3><p class="muted" style="margin-top:15px;font-size:12px">Kedua nama ditemukan pada ${edge.chapters.length} bab di bawah. Ini tidak membuktikan jenis hubungan, pertemuan, atau keberpihakan.</p><div class="evidence">${edge.chapters.map(n=>`<a href="#read/${n}?find=${encodeURIComponent(edge.a.canonical)}" data-close-content>Bab ${n}</a>`).join('')}</div></div>`;showDialog('content-dialog');}

function bindDropZone(){const z=$('#drop-zone');if(!z)return;z.ondragover=e=>{e.preventDefault();z.classList.add('dragover');};z.ondragleave=()=>z.classList.remove('dragover');z.ondrop=e=>{e.preventDefault();z.classList.remove('dragover');const f=e.dataTransfer.files[0];if(!f||!f.name.toLowerCase().endsWith('.zip'))return toast('Tarik satu berkas ZIP novel, atau gunakan tombol Pilih folder.');closeDialog('content-dialog');runImport(()=>importZIP(f));};}
async function runImport(task){capturePosition();if(app.model)persist();toast('Membaca berkas novel...');try{await task();closeDialog('content-dialog');toast(`${app.model.chapters.length} bab dan ${app.model.fileCount} Markdown siap dibaca.`);}catch(error){if(!app.model||app.status!=='ready')renderOnboarding(error.message);else announceError(error);}}
function openHelp(){$('#content-dialog').innerHTML=dialogHeader('Sedikit panduan untuk ruangmu')+`<div class="dialog-body"><div class="stack"><div><h3>Membaca, bukan mengelola berkas</h3><p class="muted small" style="margin-top:9px">Gunakan Daftar bab atau Lanjut membaca. Tombol Aa mengatur tampilan. Pilih teks di dalam cerita untuk menyimpan kutipan. Tandai selesai secara manual agar batas spoiler bergerak.</p></div><div><h3>Pintasan keyboard</h3><div class="help-grid" style="margin-top:12px"><span>Cari dalam novel</span><kbd>Ctrl / Cmd + K</kbd><span>Bab sebelumnya / berikutnya</span><kbd>Alt + panah kiri / kanan</kbd><span>Tutup panel / keluar mode fokus</span><kbd>Escape</kbd></div></div><div class="notice">${icon('shield')}<p>Safe mode menyaring rekap dan hasil pencarian. Dokumen global tetap dilindungi karena deskripsinya belum tentu bertanggal. Membuka semua spoiler perlu persetujuanmu.</p></div><div><h3>Data tetap milikmu</h3><p class="muted small" style="margin-top:9px">Tidak ada akun, analitik, unggahan, atau request CDN. Tema, posisi, penanda, dan catatan disimpan di localStorage per novel. Menghapus data browser akan menghapusnya; gunakan Ekspor cadangan. Sumber impor folder/ZIP perlu dipilih ulang setelah reload.</p></div><div><h3>Ketika koleksi bertambah</h3><p class="muted small" style="margin-top:9px">Dengan node serve.mjs, tombol Muat ulang menemukan Markdown terbaru. Pada hosting statis, jalankan node build-manifest.mjs setelah menambah atau menghapus berkas. Dokumen sumber tidak pernah ditulis ulang oleh pembaca.</p></div></div></div>`;showDialog('content-dialog');}
/* Full-text search. Unknown/undated global notes never enter safe-mode results. */
function excerpt(text,query){const textPlain=plain(text).replace(/\s+/g,' ');const start=textPlain.toLowerCase().indexOf(query.toLowerCase());const from=Math.max(0,start-65),end=Math.min(textPlain.length,(start<0?0:start)+query.length+110);return(from?'... ':'')+textPlain.slice(from,end)+(end<textPlain.length?' ...':'');}
function markedSnippet(text,query){const safe=esc(text),q=esc(query).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return safe.replace(new RegExp(q,'gi'),'<mark>$&</mark>');}catch{return safe;}}
function searchCollection(query){const q=normal(query);if(q.length<2)return[];const all=app.searchAll||app.prefs.spoilerAll,cutoff=all?app.model.maxChapter:safeCutoff(),results=[];for(const c of app.model.chapters){if(c.number>cutoff)continue;if(normal(c.body+' '+c.title).includes(q))results.push({kind:'Bab '+c.number,title:c.title,text:excerpt(c.body,query),route:'read/'+c.number+'?find='+encodeURIComponent(query),score:normal(c.title).includes(q)?0:2});if(c.recap&&normal(c.recap.text).includes(q))results.push({kind:'Rekap bab '+c.number,title:c.title,text:excerpt(c.recap.text,query),source:c.recap.path,score:3});}for(const t of app.model.terms){if(!all&&(t.first===null||t.first>cutoff))continue;const text=t.source+' '+t.canonical+(all?' '+t.notes:'');if(normal(text).includes(q))results.push({kind:'Glosarium',title:t.canonical,text:excerpt(text,query),term:t.id,score:1});}for(const [path,text]of app.files){if(path.includes('/'))continue;if(!all&&!['NOVEL.md','STYLE_GUIDE.md'].includes(path))continue;if(normal(text).includes(q))results.push({kind:'Dokumen sumber',title:path,text:excerpt(text,query),source:path,score:4});}return results.sort((a,b)=>a.score-b.score);}
function openSearch(){if(!app.model)return openSourcePicker();app.searchAll=false;$('#search-dialog').innerHTML=`<div class="search-input-line">${icon('search')}<label class="sr-only" for="global-search">Cari teks, nama, atau istilah</label><input id="global-search" type="search" placeholder="Cari kalimat, nama, atau istilah..." autocomplete="off" maxlength="120"><button class="icon-btn" data-action="close-dialog" data-dialog="search-dialog" aria-label="Tutup pencarian">${icon('close')}</button></div><div class="search-scope"><span id="search-scope-label">${app.prefs.spoilerAll?'Pencarian seluruh koleksi':'Hanya sampai bab '+safeCutoff()+' dan metadata umum'}</span><button data-action="search-all" id="search-scope-button">${app.prefs.spoilerAll?'Semua spoiler dibuka':'Cari seluruh cerita'}</button></div><div class="search-results" id="search-results"><p class="search-hint">Ketik sedikitnya 2 karakter. Hasil selalu menyertakan sumber.</p></div>`;showDialog('search-dialog');$('#global-search').focus();}
function updateSearch(){const input=$('#global-search');if(!input)return;const query=input.value.trim();app.searchResults=searchCollection(query);const display=app.searchResults.slice(0,50);$('#search-results').innerHTML=query.length<2?'<p class="search-hint">Ketik sedikitnya 2 karakter untuk mulai mencari.</p>':display.length?`<p class="results-caption" style="padding:8px 14px">${app.searchResults.length} hasil${app.searchResults.length>50?' &middot; menampilkan 50 pertama':''}</p>${display.map((r,i)=>`<button class="result-item" data-action="search-result" data-index="${i}"><small>${esc(r.kind)}</small><strong>${esc(r.title)}</strong><p>${markedSnippet(r.text,query)}</p></button>`).join('')}`:'<p class="search-hint">Tidak ada hasil dalam batas pencarian ini. Coba kata lain atau ubah batas spoiler.</p>';}
/* Reader-owned notes. Source Markdown remains read-only. */
function captureSelection(){if(!app.chapter||!app.readingReady)return;const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;const range=sel.getRangeAt(0),article=$('#chapter-prose');if(!article.contains(range.startContainer)||!article.contains(range.endContainer))return;const quote=sel.toString().trim();if(!quote)return;const start=range.startContainer.nodeType===Node.ELEMENT_NODE?range.startContainer:range.startContainer.parentElement;app.selection={quote:quote.slice(0,12000),pid:start.closest('[data-pid]')?.dataset.pid||'',chapter:app.chapter.number};$('#quote-toolbar').hidden=false;}
function openNote(note=null,selection=null){const chapter=note?.chapter||selection?.chapter||app.chapter?.number;if(!chapter)return toast('Buka bab terlebih dahulu untuk menulis catatan.');const quote=note?.quote||selection?.quote||'';app.editingNote=note?.id||null;app.noteDraft={chapter,quote,pid:note?.pid||selection?.pid||app.saved.positions[chapter]?.pid||''};$('#note-dialog').innerHTML=`<form id="note-form"><div class="dialog-header"><div><h2 id="note-dialog-title">${note?'Edit catatan':'Simpan sepotong cerita'}</h2><small>Bab ${chapter} &middot; Hanya di ruang pribadimu</small></div><button type="button" class="icon-btn" data-action="close-dialog" data-dialog="note-dialog" aria-label="Tutup">${icon('close')}</button></div><div class="dialog-body">${quote?`<blockquote class="quote-preview">${esc(quote)}</blockquote>`:'<p class="muted small">Catatan ini terhubung dengan posisi bacamu di bab tersebut.</p>'}<label class="field-label" for="note-text">Catatanmu ${quote?'(opsional)':''}</label><textarea id="note-text" name="text" rows="5" maxlength="20000" placeholder="Apa yang ingin kamu ingat?" ${quote?'':'required'}>${esc(note?.text||'')}</textarea></div><div class="dialog-footer"><button type="button" class="btn" data-action="close-dialog" data-dialog="note-dialog">Batal</button><button type="submit" class="btn primary">${icon('bookmark')}Simpan catatan</button></div></form>`;$('#quote-toolbar').hidden=true;showDialog('note-dialog');$('#note-text').focus();}
function saveNote(event){event.preventDefault();const text=$('#note-text').value.trim(),draft=app.noteDraft;if(!draft)return;if(!text&&!draft.quote)return toast('Tulis catatan atau pilih kutipan terlebih dahulu.');const existing=app.saved.notes.find(n=>n.id===app.editingNote);if(existing){existing.text=text;}else{app.saved.notes.push({id:makeId(),...draft,text,created:Date.now()});}persist();closeDialog('note-dialog');getSelection()?.removeAllRanges();app.selection=null;toast('Catatan tersimpan di browser ini.');if(app.route==='notes')refreshContentInPlace();}
function downloadText(filename,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function exportBackup(){capturePosition();persist();const data={format:'ruang-baca',version:1,novel:{id:app.model.id,title:app.model.title,language:app.model.language},exportedAt:new Date().toISOString(),prefs:app.prefs,saved:app.saved};downloadText('ruang-baca-'+app.model.id+'-backup.json',JSON.stringify(data,null,2),'application/json');toast('Cadangan progres dan catatan diekspor.');}
async function importBackup(file){if(file.size>8*1024*1024)throw new Error('Cadangan melebihi 8 MB.');const data=JSON.parse(await file.text());if(data.format!=='ruang-baca'||data.version!==1||!data.saved||!data.prefs)throw new Error('Format cadangan tidak sesuai.');if(data.novel?.id!==app.model.id)throw new Error('Cadangan ini milik novel atau bahasa yang berbeda.');if(!await confirmAction('Gabungkan cadangan?',`Penanda, bab selesai, dan catatan akan digabungkan. Pengaturan mengikuti cadangan.${data.prefs.spoilerAll?' Perhatian: cadangan ini membuka semua spoiler.':''}`,'Gabungkan'))return;const incoming=validateSaved(data.saved);app.saved.bookmarks=[...new Set([...app.saved.bookmarks,...incoming.bookmarks])];app.saved.completed=[...new Set([...app.saved.completed,...incoming.completed])];const notes=new Map(app.saved.notes.map(n=>[n.id,n]));for(const n of incoming.notes)notes.set(n.id,n);app.saved.notes=[...notes.values()];for(const [n,p]of Object.entries(incoming.positions)){if((app.saved.positions[n]?.updated||0)<p.updated)app.saved.positions[n]=p;}if(incoming.last!==null)app.saved.last=incoming.last;app.prefs=validatePrefs(data.prefs);applyPrefs();persist();refreshContentInPlace();toast('Cadangan digabungkan.');}
function exportNotes(){const title=app.model.title;let text=`# Catatan pembaca: ${title}\n\nDiekspor: ${new Date().toISOString()}\n\n`;for(const n of app.saved.notes){text+=`## Bab ${n.chapter} - ${app.model.chapterMap.get(n.chapter)?.title||''}\n\n`;if(n.quote)text+=n.quote.split('\n').map(l=>'> '+l).join('\n')+'\n\n';text+=(n.text||'')+'\n\n---\n\n';}if(!app.saved.notes.length)text+='Belum ada catatan.\n';downloadText('catatan-'+app.model.id+'.md',text,'text/markdown;charset=utf-8');}
async function toggleComplete(number){const exists=app.saved.completed.includes(number);if(exists&&!await confirmAction('Batalkan status selesai?','Bab ini akan kembali berstatus belum selesai. Batas spoiler otomatis dapat mundur. Catatan dan posisi tetap tersimpan.','Batalkan selesai'))return;app.saved.completed=exists?app.saved.completed.filter(n=>n!==number):[...app.saved.completed,number];persist();if(app.route==='read'){$$('[data-action="complete"]').forEach(b=>b.innerHTML=icon('check')+(exists?'Tandai selesai':'Sudah ditandai selesai'));renderShell();}else refreshContentInPlace();toast(exists?'Status selesai dibatalkan.':`Bab ${number} selesai. Batas aman otomatis: bab ${safeCutoff()}.`);}
function toggleBookmark(number){if(!app.model.chapterMap.has(number))return;const existed=app.saved.bookmarks.includes(number);app.saved.bookmarks=existed?app.saved.bookmarks.filter(n=>n!==number):[...app.saved.bookmarks,number];persist();$$(`[data-action="bookmark"][data-chapter="${number}"]`).forEach(b=>{b.classList.toggle('active',!existed);b.setAttribute('aria-pressed',String(!existed));b.setAttribute('aria-label',`${existed?'Tandai':'Hapus penanda'} bab ${number}`);});toast(existed?'Penanda dihapus.':'Bab ditambahkan ke penanda.');if(app.route==='notes')refreshContentInPlace();}

 if($('#sidebar').classList.contains('mobile-open')&&event.key==='Tab'){const items=$$('a,button', $('#sidebar')).filter(e=>!e.disabled);const first=items[0],last=items.at(-1);if(event.shiftKey&&active===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&active===last){event.preventDefault();first.focus();}return;}
 if((event.key==='Enter'||event.key===' ')&&active?.matches('g.node')){event.preventDefault();openTerm(active.dataset.id);return;}
 if(event.altKey&&!typing&&!$('dialog[open]')&&app.chapter&&['ArrowLeft','ArrowRight'].includes(event.key)){const i=app.model.chapters.indexOf(app.chapter),next=app.model.chapters[i+(event.key==='ArrowRight'?1:-1)];if(next){event.preventDefault();go('read/'+next.number);}}
});
$('#quote-toolbar').addEventListener('mousedown',e=>e.preventDefault());
document.addEventListener('pointerup',event=>{if(event.target instanceof Element&&event.target.closest('#chapter-prose'))setTimeout(captureSelection,50);});
document.addEventListener('keyup',event=>{if(event.shiftKey&&app.chapter)captureSelection();});
$('#mobile-backdrop').addEventListener('click',closeMobileNav);
window.addEventListener('scroll',()=>{if(!app.readingReady)return;if(!app.scrollFrame)app.scrollFrame=requestAnimationFrame(()=>{updateReadingProgress();app.scrollFrame=0;});clearTimeout(app.scrollTimer);app.scrollTimer=setTimeout(()=>{capturePosition();persist();},220);},{passive:true});
window.addEventListener('pagehide',()=>{capturePosition();if(app.model)persist();});
window.addEventListener('hashchange',renderRoute);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(app.prefs.theme==='system')applyPrefs();});
matchMedia('(max-width: 760px)').addEventListener('change',closeMobileNav);
// A small documented interface for agent-driven integration or automated checks.
window.NovelReader=Object.freeze({version:'1.0.0',getSnapshot:()=>({status:app.status,title:app.model?.title,chapters:app.model?.chapters.length||0,recaps:app.model?.recaps.size||0,files:app.files.size,terms:app.model?.terms.length||0,termRows:app.model?.termRows||0,issueCount:app.model?.issues.length||0,source:app.source,currentChapter:app.chapter?.number||null,spoilerCutoff:safeCutoff(),completed:app.saved.completed.length,bookmarks:app.saved.bookmarks.length,notes:app.saved.notes.length}),reload:()=>runImport(loadHTTP)});
(async function init(){applyPrefs();renderShell();closeMobileNav();if(location.protocol==='file:'){renderOnboarding();return;}try{await loadHTTP();}catch(error){renderOnboarding(error.message);}})();

</script>
</body>
